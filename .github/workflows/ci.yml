name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features include bus+coord+relay+hive (mirrors the Homebrew
      # bottle). The `features` job below covers each feature on its own.
      - run: cargo check --all-targets

  # #482: a feature combination that is offered but never built will rot. Only
  # `hive` and the default set were covered, and as a result *every* build
  # without `hive` — including `--no-default-features` with nothing at all —
  # had stopped compiling, because unconditional `crate::hive` paths had crept
  # into config, the relay and the brain-baseline command.
  #
  # Each feature is exercised alone rather than in combination. The
  # single-feature builds are the ones that actually broke, and they are the
  # strictest: anything unused in a lone build is caught by `-D warnings`.
  features:
    name: Features (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: none
            flags: "--no-default-features"
          - label: hive
            flags: "--no-default-features --features hive"
          - label: relay
            flags: "--no-default-features --features relay"
          - label: coord
            flags: "--no-default-features --features coord"
          - label: bus
            flags: "--no-default-features --features bus"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings
      - run: cargo test --all-targets ${{ matrix.flags }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  # Workspace refactor (#279) — verify claudectl-core builds and tests
  # standalone, without the binary crate. Guards the
  # claudectl → claudectl-core dependency direction at the workspace level.
  core-standalone:
    name: Core (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build claudectl-core standalone
        run: cargo build -p claudectl-core
      - name: Clippy claudectl-core standalone
        run: cargo clippy -p claudectl-core --all-targets -- -D warnings
      - name: Test claudectl-core standalone
        run: cargo test -p claudectl-core

  # Same guarantee for claudectl-tui (#275): builds and tests without the
  # binary crate. Catches accidental `crate::brain::*` or other binary refs
  # that would only break under workspace builds.
  tui-standalone:
    name: TUI (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build claudectl-tui standalone
        run: cargo build -p claudectl-tui
      - name: Clippy claudectl-tui standalone
        run: cargo clippy -p claudectl-tui --all-targets -- -D warnings
      - name: Test claudectl-tui standalone
        run: cargo test -p claudectl-tui

  # Layering check: nothing inside claudectl-core may reference binary-crate
  # modules. This is a textual guard on top of the standalone build above —
  # the build would already fail on a real upward dep, but grep catches
  # subtler attempts (e.g. cfg-gated paths that don't trip on this matrix).
  layering:
    name: Layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No `crate::{brain,bus,coord,hive,relay,init,orchestrator,launch,hooks,recorder,session_recorder,app,ui,demo}` inside claudectl-core
        run: |
          set -e
          PATTERN='crate::(brain|bus|coord|hive|relay|init|orchestrator|launch|hooks|recorder|session_recorder|app|ui|demo)\b'
          if grep -rEn "${PATTERN}" crates/claudectl-core/src/ ; then
            echo "::error::claudectl-core must not depend on binary-crate modules. See #279 dependency rule."
            exit 1
          fi
          echo "claudectl-core has no upward dependencies on the binary crate."
